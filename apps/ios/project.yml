# XcodeGen spec for the Tester iOS/iPadOS app. `build-ipa.sh` copies the web app into ./www,
# generates Tester.xcodeproj from this file and builds an unsigned .ipa for SideStore / AltStore.
# Two targets: the app, and TesterWidgets (Home Screen / Lock Screen widgets + the iOS 18 control).
# Shared/ holds the data both read (app group files) and the Siri / Shortcuts actions.
name: Tester
options:
  bundleIdPrefix: app.tester
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "3.1.0"
    CURRENT_PROJECT_VERSION: "2"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: ""
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGNING_ALLOWED: NO
    DEVELOPMENT_TEAM: ""
    ENABLE_BITCODE: NO
    SUPPORTS_MACCATALYST: NO
    TARGETED_DEVICE_FAMILY: "1,2"
targets:
  Tester:
    type: application
    platform: iOS
    sources:
      - path: Tester
        excludes: ["*.entitlements"]
      - path: Shared
      - path: www
        type: folder
        buildPhase: resources
    dependencies:
      - target: TesterWidgets
        embed: true
        codeSign: false
    settings:
      base:
        PRODUCT_NAME: Tester
        PRODUCT_BUNDLE_IDENTIFIER: app.tester.desk
        INFOPLIST_FILE: Tester/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    scheme: {}
  TesterWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Widgets
        excludes: ["*.entitlements", "Info.plist"]
      - path: Shared
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    settings:
      base:
        PRODUCT_NAME: TesterWidgets
        PRODUCT_BUNDLE_IDENTIFIER: app.tester.desk.widgets
        INFOPLIST_FILE: Widgets/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
